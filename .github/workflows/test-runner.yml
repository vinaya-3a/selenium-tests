name: Run Specific TestNG Test Cases

on:
  workflow_dispatch:
    inputs:
      testcase:           # this now holds class names, possibly comma-separated
        required: true
        type: string

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Print Incoming Test Classes
        run: |
          echo "🧪 Classes Received to Execute:"
          echo "${{ github.event.inputs.testcase }}"

      # Updated: execute specific test cases using Maven -Dtest
      - name: Build and Execute Selected Test Classes
        run: |
          mvn clean test -Dtest="${{ github.event.inputs.testcase }}" \
            || echo "❌ Test run failed but continuing"
        continue-on-error: true

      # Ensure a consolidated report.json is always generated in /reports
      - name: Ensure Report Exists
        if: always()
        run: |
          mkdir -p reports
          if ls reports/*.json 1> /dev/null 2>&1; then
            echo "✔ Reports Found"
          else
            echo "⚠ No JSON report found. Creating empty report."
            echo '{"summary":{"passed":0,"failed":0,"skipped":0},"details":[]}' > reports/empty-report.json
          fi

      - name: Export Latest Report Filename
        if: always()
        id: extract_report
        run: |
          REPORT_PATH=$(ls -t reports/*.json | head -n 1 || echo "")
          echo "🗂 Latest Report: $REPORT_PATH"
          echo "REPORT_FILE=$REPORT_PATH" >> $GITHUB_ENV
          echo "report_file=$REPORT_PATH" >> $GITHUB_OUTPUT

      - name: Print Report Content (Debugging Only)
        if: always()
        run: |
          echo "📄 Report Content:"
          cat ${{ env.REPORT_FILE }}

      - name: Upload Test Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ${{ env.REPORT_FILE }}
